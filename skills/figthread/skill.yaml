schema: hadara.skill/v0.1
name: figthread
version: 1.4.0
description: >-
  Design and validate semantic figures through promoted semantic state,
  canonical figure grammar, primitive-bound visual structure,
  profile-strengthened readability, deterministic linear and radial layout geometry,
  deterministic SVG rendering, browser-resolved text evidence,
  self-contained HTML runtime composition, multi-target document packaging,
  deterministic semantic motion, content-addressed HTML/SVG and browser-captured PNG export derivatives,
  and resumable evidence-bound execution workspaces.
entry:
  skill: SKILL.md
resources:
  templates: templates/
  references: references/
  assets: assets/
  schemas: schemas/
  grammars: grammars/
  primitives: primitives/
  profiles: profiles/
  runtime: runtime/
  scripts: scripts/
  examples: examples/
compatibility:
  agents: [Claude Code, Codex CLI]
  os: [windows, linux, macos]
interface:
  display_name: "Figthread"
  short_description: "Author deterministic multi-target semantic figures"
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.svg"
  default_prompt: "Use $figthread to run the figure workflow in a resumable evidence-bound workspace: author and validate semantic state, promote grammar and visual authority, strengthen readability per target profile, resolve deterministic linear or registered radial layout independently for each target, render and certify browser-resolved text, compile semantic motion when useful, package exact promoted target documents into one self-contained multi-target HTML when needed, and export only promoted derivatives including browser-captured PNG when requested."
policy:
  allow_implicit_invocation: true
