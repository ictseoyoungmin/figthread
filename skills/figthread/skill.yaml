schema: hadara.skill/v0.1
name: figthread
version: 0.4.0
description: >-
  Design and validate semantic figures through promoted semantic state,
  primitive-bound visual structure, deterministic layout geometry, and
  deterministic semantic motion.
entry:
  skill: SKILL.md
resources:
  templates: templates/
  references: references/
  assets: assets/
  schemas: schemas/
  primitives: primitives/
  runtime: runtime/
  scripts: scripts/
  examples: examples/
compatibility:
  agents: [Claude Code, Codex CLI]
  os: [windows, linux, macos]
interface:
  display_name: "Figthread"
  short_description: "Author semantic figures with primitive-bound layout and motion"
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.svg"
  default_prompt: "Use $figthread to author and validate semantic figure state, bind it to explanatory primitives, resolve deterministic layout geometry, and add semantic motion only when motion adds meaning."
policy:
  allow_implicit_invocation: true
