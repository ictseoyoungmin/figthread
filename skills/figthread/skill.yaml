schema: hadara.skill/v0.1
name: figthread
version: 0.8.0
description: >-
  Design and validate semantic figures through promoted semantic state,
  canonical figure grammar, primitive-bound visual structure,
  profile-strengthened readability, deterministic layout geometry,
  deterministic SVG rendering evidence, self-contained HTML runtime composition,
  and deterministic semantic motion.
entry:
  skill: SKILL.md
resources:
  templates: templates/
  references: references/
  assets: assets/
  schemas: schemas/
  grammars: grammars/
  primitives: primitives/
  profiles: profiles/
  runtime: runtime/
  scripts: scripts/
  examples: examples/
compatibility:
  agents: [Claude Code, Codex CLI]
  os: [windows, linux, macos]
interface:
  display_name: "Figthread"
  short_description: "Author deterministic semantic figures as self-contained HTML"
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.svg"
  default_prompt: "Use $figthread to author and validate semantic figure state, promote one canonical figure grammar, bind explanatory primitives, strengthen readability with the target profile, resolve deterministic layout, render and audit the static SVG, compile semantic motion when useful, and package the promoted authorities into one self-contained HTML document."
policy:
  allow_implicit_invocation: true
