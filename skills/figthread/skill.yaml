schema: hadara.skill/v0.1
name: figthread
version: 1.0.0
description: >-
  Design and validate semantic figures through promoted semantic state,
  canonical figure grammar, primitive-bound visual structure,
  profile-strengthened readability, deterministic layout geometry,
  deterministic SVG rendering evidence, self-contained HTML runtime composition,
  deterministic semantic motion, content-addressed export derivatives,
  and resumable evidence-bound execution workspaces.
entry:
  skill: SKILL.md
resources:
  templates: templates/
  references: references/
  assets: assets/
  schemas: schemas/
  grammars: grammars/
  primitives: primitives/
  profiles: profiles/
  runtime: runtime/
  scripts: scripts/
  examples: examples/
compatibility:
  agents: [Claude Code, Codex CLI]
  os: [windows, linux, macos]
interface:
  display_name: "Figthread"
  short_description: "Author deterministic semantic figures with resumable evidence"
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.svg"
  default_prompt: "Use $figthread to run the figure workflow in a resumable evidence-bound workspace: author and validate semantic state, promote grammar and visual authority, strengthen readability with the target profile, resolve deterministic layout, render and review exact artifacts, compile semantic motion when useful, package the promoted authorities into one self-contained HTML document, and export only promoted derivatives."
policy:
  allow_implicit_invocation: true
