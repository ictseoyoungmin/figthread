name: CI
on:
  push:
  pull_request:
jobs:
  promotion-gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run validate -- skills/figthread/examples/minimal.figure.json
      - run: npm run validate:promote -- skills/figthread/examples/minimal.figure.json
      - run: npm run layout -- skills/figthread/examples/minimal.figure.json skills/figthread/examples/minimal.layout-request.json
      - run: npm run layout:promote -- skills/figthread/examples/minimal.figure.json skills/figthread/examples/minimal.layout-request.json
      - run: npm run motion -- skills/figthread/examples/minimal.figure.json skills/figthread/examples/minimal.layout-request.json skills/figthread/examples/minimal.motion.json
      - run: npm run motion:promote -- skills/figthread/examples/minimal.figure.json skills/figthread/examples/minimal.layout-request.json skills/figthread/examples/minimal.motion.json
